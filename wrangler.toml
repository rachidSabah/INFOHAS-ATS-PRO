# ResumeAI Pro — Cloudflare Worker API config
# NOTE: This file is for the Workers API deployment only.
# Cloudflare Pages uses its own build process (next-on-pages).
# The pages_build_output_dir is NOT set here to avoid conflicts with Pages auto-build.

name = "resumeai-pro-api"
main = "workers/api/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "resumeai-pro-db"
database_id = "4485ee27-7fec-4077-a39d-c5cc4b1b9167"

# KV namespace for caching
[[kv_namespaces]]
binding = "CACHE"
id = "4521e79873524900bb373a245d095fcf"

# Workers AI — Cloudflare-native rescue tier (free neurons/day, in-account
# inference, no egress). Bound ONLY to the Workers API; the Pages frontend
# reaches it through POST /api/ai/workers-ai (shared-secret gated).
[ai]
binding = "AI"

[vars]
APP_NAME = "ResumeAI Pro"
APP_URL = "https://resumeai-pro.pages.dev"
# CORS_ORIGIN: Set to "*" to allow all origins (needed for Cloudflare Pages
# preview deployments which have dynamic URLs like bcf5bbd9.resumeai-pro.pages.dev).
# For production with a custom domain, set to "https://yourdomain.com".
CORS_ORIGIN = "*"
# Zen warming egress: DIRECT from this Worker (Cloudflare's shared pool).
# The managed Vercel relay was retired 2026-09-11 — the project is
# Cloudflare-only. If the shared pool ever needs an escape hatch again, point
# OPENCODE_API_BASE at a SELF-HOSTED non-Cloudflare relay serving /zen/*
# (see docs/ZEN_SHARED_EGRESS_HEALTH.md) instead of a PaaS-hosted one.
# WORKERSAI_SHARED_SECRET is injected at deploy time from the GitHub Actions
# secret of the same name (NOT stored in this public file):
#   deploy command: wrangler deploy --var WORKERSAI_SHARED_SECRET:${{ secrets.WORKERSAI_SHARED_SECRET }}

# Cron Triggers — Zen free-model warming (ingest + 1-token probes + KV write).
# Pages Functions cannot run scheduled handlers, so warming lives on this
# Worker: every hour at minute 0, ahead of the 3900s KV TTL.
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true

[placement]
mode = "smart"
