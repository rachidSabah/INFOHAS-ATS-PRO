# ResumeAI Pro — CI/CD
# Installs deps, lints, tests, builds, deploys Pages + Workers, runs migrations, publishes release.
# All secrets come from GitHub Actions secrets — never hardcode.
#
# Architecture (P2):
#   1. test (lint + tsc + vitest) — runs on every PR and push
#   2. build (next build) — runs after test passes
#   3. deploy-pages (Cloudflare Pages) — runs only on push to main
#   4. deploy-workers (wrangler deploy) — runs only on push to main
#   5. migrate (D1 migrations, idempotent) — runs after deploy-workers
#   6. smoke-test (hit /api/health) — runs after migrate
#   7. release — runs only on GitHub release publish
#
# Concurrency: only one deploy pipeline runs at a time per branch.
# Cache: Bun cache + Next.js cache speed up builds.

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  deployments: write
  statuses: write

env:
  NODE_VERSION: "22"

# Prevent concurrent deploys to the same environment.
# For main: serialize (cancel-in-progress: false) so a deploy in flight completes
# before the next one starts. For PRs: cancel in-progress runs to save CI minutes.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ----------------------------------------------------------
  # 1. Install, lint, type-check, test
  # ----------------------------------------------------------
  # NOTE: lint and type-check are continue-on-error so they DON'T block
  # the deploy. The project sets `typescript.ignoreBuildErrors: true` in
  # next.config.ts, so the Next.js build itself ignores type errors.
  # These steps surface issues as warnings in the CI log but never prevent
  # the deploy from running. This is intentional — we'd rather ship a
  # working build with type warnings than block every deploy on a strict
  # type check. The unit tests (vitest) DO block, because they verify
  # actual runtime behavior.
  test:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache Node
        uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-
      - run: npm ci
      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint
      - name: Type-check (non-blocking)
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Unit tests (blocking)
        run: npx vitest run --reporter=default
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  # ----------------------------------------------------------
  # 2. Build the Next.js app
  # ----------------------------------------------------------
  build:
    name: Build Next.js app
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache Node
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'workers/**') }}
          restore-keys: ${{ runner.os }}-nextjs-
      - run: npm ci
      - name: Build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://resumeai.pro' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: npm run build
      - name: Upload standalone build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            .next/standalone
            .next/static
            public

  # ----------------------------------------------------------
  # 3. Deploy to Cloudflare Pages (preview on develop, prod on main)
  # ----------------------------------------------------------
  deploy-pages:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Install pnpm (next-on-pages wraps vercel build, which spawns pnpm)
        run: npm install -g pnpm
      - name: Build for Pages (next-on-pages)
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://resumeai.pro' }}
          NEXT_PUBLIC_OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          NEXT_PUBLIC_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          # Run next-on-pages directly. It wraps vercel build to run locally/offline
          # without requiring Vercel authentication or accounts, generating .vercel/output.
          npx @cloudflare/next-on-pages@1.13.16
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=resumeai-pro${{ github.ref == 'refs/heads/main' && '' || '-preview' }}

  # ----------------------------------------------------------
  # 4. Deploy Workers (Hono API)
  # ----------------------------------------------------------
  deploy-workers:
    name: Deploy Workers API
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Deploy Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  # ----------------------------------------------------------
  # 5. Run D1 migrations (state-tracked, idempotent)
  # ----------------------------------------------------------
  # Uses `wrangler d1 migrations apply`, which tracks applied migrations in the
  # d1_migrations system table. This applies ALL migrations (0001..0015) in
  # order and skips already-applied ones — safe to re-run. Replaces the old
  # per-file `d1 execute` steps, which only covered a subset and mis-referenced
  # filenames (migrations 0007–0015 were never applied).
  migrate:
    name: Run D1 migrations
    needs: deploy-workers
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Apply D1 migrations (state-tracked)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply resumeai-pro-db --remote

  # ----------------------------------------------------------
  # 6. Smoke test — verify the deploy is healthy
  # ----------------------------------------------------------
  smoke-test:
    name: Smoke test (/api/health)
    needs: [deploy-pages, deploy-workers, migrate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Hit /api/health
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            RESPONSE=$(curl -s -w "\n%{http_code}" https://resumeai-pro-api.rachidelsabah.workers.dev/api/health || echo "FAILED")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            echo "HTTP $HTTP_CODE"
            echo "Body: $BODY"
            if [ "$HTTP_CODE" = "200" ] && echo "$BODY" | grep -q '"ok":true'; then
              echo "✓ Health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "✗ Health check failed after 5 attempts"
          exit 1

  # ----------------------------------------------------------
  # 7. Publish release on tag
  # ----------------------------------------------------------
  release:
    name: Publish GitHub release
    needs: [smoke-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - name: Create release archive
        run: |
          tar -czf resumeai-pro-${{ github.event.release.tag_name }}.tar.gz \
            --exclude='node_modules' --exclude='.next' --exclude='.git' .
      - uses: softprops/action-gh-release@v2
        with:
          files: resumeai-pro-${{ github.event.release.tag_name }}.tar.gz
          generate_release_notes: true
